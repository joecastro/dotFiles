[project]
name = "dotfiles"
version = "0.0.0"
description = "Personal dotfiles helpers and tooling."
authors = [{ name = "Joe" }]
requires-python = ">=3.10"
dependencies = [
    "jsmin==3.0.1",
    "ruff>=0.16",
    "pyright>=1.1",
    "boto3>=1.28",
    "boto3-stubs[ec2,eks,elbv2,elb,ecr,logs,iam,kms,sts,s3]>=1.28",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
include = ["apply.py", "verify_fonts.py", "aws", "iterm2", "zsh"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "out",
    "sublime_text",
]
